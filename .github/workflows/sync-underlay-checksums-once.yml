name: One-shot Underlay checksum sync
on:
  push:
    branches: [refactor/tailscale-lite-lightweight-only]
    paths:
      - .github/workflows/sync-underlay-checksums-once.yml
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Update Go module checksums
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git add go.mod go.sum
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: sync tsdial explicit Underlay dependency checksum'
          git push origin HEAD:refactor/tailscale-lite-lightweight-only
