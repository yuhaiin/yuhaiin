name: Traffic Control P0/P1 validation

on:
  push:
    branches: [feat/traffic-control-p0-p1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-initial-branch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/traffic-control-p0-p1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: traffic-control-format
      - name: Format new and modified Go sources
        shell: bash
        run: |
          gofmt -w pkg/net/trafficcontrol/*.go
          gofmt -w pkg/net/proxy/tun/lightweight/{stack.go,output.go,packet_batch.go,config.go,fair_output.go,fair_output_test.go}
          gofmt -w pkg/net/nat/{table.go,source.go,receive.go,reply.go,resource_test.go}
          gofmt -w pkg/inbound/handler.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pkg/net/trafficcontrol pkg/net/proxy/tun/lightweight pkg/net/nat pkg/inbound/handler.go
            git commit -m "style(trafficcontrol): gofmt P0/P1 implementation [skip ci]"
            git push origin HEAD:feat/traffic-control-p0-p1
          fi

  protocol-and-resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: traffic-control-validation
      - name: Governor, NAT, TUN and inbound race tests
        run: go test -race -count=1 -timeout=240s ./pkg/net/trafficcontrol/... ./pkg/net/nat/... ./pkg/net/proxy/tun/lightweight/... ./pkg/inbound/...
      - name: Fast-path and fair scheduler benchmark smoke tests
        run: go test ./pkg/net/trafficcontrol ./pkg/net/nat ./pkg/net/proxy/tun/lightweight -run '^$' -bench 'Benchmark(FairQueue|Governor|NATSession|OutputFlowHash)' -benchtime=10x -benchmem -timeout=180s
