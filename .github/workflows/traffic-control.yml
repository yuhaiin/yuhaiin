name: Traffic Control P0/P1 validation

on:
  push:
    branches: [feat/traffic-control-p0-p1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: traffic-control-validation
      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l pkg/net/trafficcontrol/*.go pkg/net/proxy/tun/lightweight/{stack.go,output.go,packet_batch.go,config.go,fair_output.go,fair_output_test.go} pkg/net/nat/{table.go,source.go,receive.go,reply.go,resolve.go,resource_test.go} pkg/inbound/handler.go)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet traffic control integration
        run: go vet ./pkg/net/trafficcontrol/... ./pkg/net/nat/... ./pkg/net/proxy/tun/lightweight/... ./pkg/inbound/...
      - name: Governor, NAT, TUN and inbound race tests
        run: go test -race -count=1 -timeout=240s ./pkg/net/trafficcontrol/... ./pkg/net/nat/... ./pkg/net/proxy/tun/lightweight/... ./pkg/inbound/...
      - name: Fast-path and fair scheduler benchmark smoke tests
        run: go test ./pkg/net/trafficcontrol ./pkg/net/nat ./pkg/net/proxy/tun/lightweight -run '^$' -bench 'Benchmark(FairQueue|Governor|NATSession|OutputFlowHash)' -benchtime=100x -benchmem -timeout=180s
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: traffic-control-lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m
