name: Lightweight TCP/IP stack

on:
  pull_request:
    branches: [main]
    paths:
      # Portable test files also import shared application packages.
      - 'pkg/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/benchmarks/checksum_portable.py'
      - '.github/actions/setup-go/**'
      - '.github/workflows/lightweight-stack.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: lightweight-kernel
      # Default race coverage is in tests.yml; exercise only the alternate
      # checksum implementation and privileged fixtures here.
      - name: Portable checksum fallback
        run: python3 scripts/benchmarks/checksum_portable.py test ./pkg/net/proxy/tun/lightweight -run '^TestChecksum' -count=1
      - name: Build independent Linux kernel interoperability suite
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race -c -tags lightweight_kernel -o /tmp/lightweight-kernel.test ./pkg/net/proxy/tun/lightweight
          go test -race -c -tags lightweight_kernel -o /tmp/lightweight-device.test ./pkg/net/proxy/tun/device
          go test -race -c -tags lightweight_kernel -o /tmp/lightweight-tun.test ./pkg/net/proxy/tun
          go test -race -c -tags lightweight_kernel -o /tmp/lightweight-offload.test ./pkg/net/proxy/tun/lightweighttun
      - name: Classic and RACK-TLP with independent kernel peers and changing PMTU
        run: |
          for recovery in classic rack-tlp; do
            sudo unshare --net /tmp/lightweight-kernel.test \
              -loss-recovery "$recovery" -test.run '^TestLinuxKernel' -test.v -test.timeout=90s
          done
      - name: Migrate IPv4 TUN with legacy MTU
        run: sudo unshare --net /tmp/lightweight-tun.test -test.run '^TestLegacyIPv4MTU1200$' -test.v -test.timeout=30s
      - name: Native TUN event and buffer cleanup after shutdown
        run: sudo unshare --net /tmp/lightweight-device.test -test.run TestLinuxKernelDeviceLifecycle -test.count=1 -test.v -test.timeout=60s
      - name: TCP checksum and segmentation offloads with kernel peers and loss
        run: sudo unshare --net /tmp/lightweight-offload.test -test.run '^TestLinuxOffload' -test.v -test.timeout=90s

  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Share setup and compiler caches instead of eight core builds and
          # three overlapping Traffic Control test-compilation jobs.
          - group: platform-tests
            targets: darwin/arm64 windows/amd64 android/arm64
          - group: core
            targets: linux/amd64 linux/arm64 linux/386 linux/mipsle ios/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: portable-${{ matrix.group }}
      - name: Compile the independent core and portable tests
        env:
          CGO_ENABLED: '0'
          TARGETS: ${{ matrix.targets }}
        run: |
          read -r -a targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            IFS=/ read -r GOOS GOARCH <<< "$target"
            export GOOS GOARCH
            go build ./pkg/net/proxy/tun/lightweight/...
            case "$GOOS" in
              darwin|windows|android)
                go test -exec=true -run '^$' \
                  ./pkg/net/trafficcontrol/... ./pkg/net/relay/... ./pkg/net/nat/... \
                  ./pkg/net/proxy/tun/... ./pkg/inbound/... ./pkg/net/proxy/hysteria2/...
                ;;
            esac
          done
      - name: Execute ARM64 checksum and guard-page tests
        if: matrix.group == 'core'
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          go test -c -o /tmp/lightweight-arm64.test ./pkg/net/proxy/tun/lightweight
          qemu-aarch64 /tmp/lightweight-arm64.test -test.run '^TestChecksum' -test.v
          qemu-aarch64 -p 16384 /tmp/lightweight-arm64.test -test.run '^TestChecksum' -test.v
