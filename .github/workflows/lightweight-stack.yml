name: Lightweight TCP/IP stack

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Drop superseded automatic checks; preserve explicitly dispatched runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: lightweight-race
      - name: Protocol, independent peers, race and resource bounds
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout=180s ./pkg/net/proxy/tun/...
      - name: SACK lost-retransmission stability (100 race runs)
        run: go test -race -count=100 -timeout=300s -run '^TestTCPSACKRepairsLostReplacementWithNewEvidence$' ./pkg/net/proxy/tun/lightweight
      - name: Parser fuzzing
        run: |
          go test ./pkg/net/proxy/tun/lightweight -run '^$' -fuzz '^FuzzParsePacket$' -fuzztime=10s -parallel=4
          go test ./pkg/net/proxy/tun/lightweight -run '^$' -fuzz '^FuzzTCPOptions$' -fuzztime=10s -parallel=4
          go test ./pkg/net/proxy/tun/lightweight -run '^$' -fuzz '^FuzzChecksum$' -fuzztime=10s -parallel=4
          go test ./pkg/net/proxy/tun/device -run '^$' -fuzz '^FuzzVirtioPacket$' -fuzztime=10s -parallel=4
      - name: Portable checksum fallback
        run: python3 scripts/benchmarks/checksum_portable.py test ./pkg/net/proxy/tun/lightweight -run '^TestChecksum' -count=1
      - name: Benchmark smoke test
        run: go test ./pkg/net/proxy/tun/lightweight/... -run '^$' -bench . -benchtime=1x -benchmem -timeout=180s

  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: lightweight-qualification
      - name: Sustained BBR v3 coexistence and changing bandwidth
        env:
          CGO_ENABLED: '1'
        run: >-
          go test -race -tags lightweight_qualification
          ./pkg/net/proxy/tun/lightweight
          -run '^TestBBR(SharedBottleneck|BandwidthChanges)$'
          -count=1 -v -timeout=600s

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: lightweight-kernel
      - name: Build independent Linux kernel interoperability suite
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race -c -tags lightweight_kernel -o /tmp/lightweight-kernel.test ./pkg/net/proxy/tun/lightweight
          go test -race -c -tags lightweight_kernel -o /tmp/lightweight-device.test ./pkg/net/proxy/tun/device
          go test -race -c -tags lightweight_kernel -o /tmp/lightweight-offload.test ./pkg/net/proxy/tun/lightweighttun
      - name: TCP, UDP fragments and ICMP in isolated network namespace
        run: sudo unshare --net /tmp/lightweight-kernel.test -test.run '^TestLinuxKernel' -test.v -test.timeout=90s
      - name: Native TUN event and buffer cleanup after repeated shutdown
        run: sudo unshare --net /tmp/lightweight-device.test -test.run '^TestLinuxKernelDeviceLifecycle$' -test.v -test.timeout=30s
      - name: TCP checksum and segmentation offloads with kernel peers and loss
        run: sudo unshare --net /tmp/lightweight-offload.test -test.run '^TestLinuxOffload' -test.v -test.timeout=90s

  portable-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: linux, arch: '386'}
          - {os: linux, arch: mipsle}
          - {os: darwin, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: android, arch: arm64}
          - {os: ios, arch: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: lightweight-${{ matrix.target.os }}-${{ matrix.target.arch }}
      - name: Compile the independent core
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: go build ./pkg/net/proxy/tun/lightweight/...
      - name: Execute ARM64 checksum and guard-page tests
        if: matrix.target.os == 'linux' && matrix.target.arch == 'arm64'
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user
          go test -c -o /tmp/lightweight-arm64.test ./pkg/net/proxy/tun/lightweight
          qemu-aarch64 /tmp/lightweight-arm64.test -test.run '^TestChecksum' -test.v
          qemu-aarch64 -p 16384 /tmp/lightweight-arm64.test -test.run '^TestChecksum' -test.v
