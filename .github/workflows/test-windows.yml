name: Smoke test Windows binary

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: yuhaiin_windows_${{ inputs.arch }}
          path: binary

      - name: Run release binary
        env:
          RELEASE_ARCH: ${{ inputs.arch }}
        run: |
          & ".\binary\yuhaiin-windows-$($env:RELEASE_ARCH).exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
