name: MASQUE Branch Formatter

on:
  push:
    branches: [codex/masque-apernet-bbr-h2]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'yuhaiin/yuhaiin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Format MASQUE and node contract Go files
        shell: bash
        run: |
          set -euo pipefail
          find pkg/net/proxy/masque -name '*.go' -print0 | xargs -0 gofmt -w
          gofmt -w pkg/net/proxy/hysteria2/masque_bbr.go pkg/contract/node/types.go
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pkg/net/proxy/masque pkg/net/proxy/hysteria2/masque_bbr.go pkg/contract/node/types.go
            git commit -m 'style(masque): gofmt new CONNECT-IP and HTTP/2 implementation'
            git push origin HEAD:codex/masque-apernet-bbr-h2
          fi
