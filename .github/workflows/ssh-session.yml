name: SSH Session Inbound

on:
  pull_request:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/actions/setup-go/**'
      - 'pkg/net/netapi/**'
      - 'pkg/net/proxy/internal/testutil/**'
      - '.github/workflows/ssh-session.yml'
      - 'pkg/net/proxy/sshserver/**'
      - 'pkg/net/proxy/processnet/**'
      - 'pkg/net/netlink/**'
      - 'pkg/contract/inbound/**'
      - 'pkg/inbound/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The default mode. Everything runs as the unprivileged runner user: no
  # sudo, no setcap. The only host change is lifting Ubuntu's AppArmor
  # restriction on unprivileged user namespaces, which is a kernel policy
  # switch, not a privilege granted to the tests.
  ssh-rootless-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: ssh-rootless-integration
      - name: Allow unprivileged user namespaces and verify TUN
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ ! -c /dev/net/tun ]; then sudo modprobe tun; fi
          test -c /dev/net/tun
      - name: Build tests
        run: |
          go test -c -o /tmp/yuhaiin-ssh.test ./pkg/net/proxy/sshserver
          go test -c -o /tmp/yuhaiin-netlink.test ./pkg/net/netlink
      - name: Run rootless SSH and process lookup tests as a normal user
        run: |
          test "$(id -u)" != 0
          YUH_REQUIRE_ROOTLESS=1 /tmp/yuhaiin-ssh.test -test.v -test.timeout=300s
          YUH_REQUIRE_ROOTLESS=1 /tmp/yuhaiin-netlink.test -test.v -test.timeout=120s -test.run 'SockDiag|ProcSearch'

  # Rootful mode, selected explicitly by administrators.
  ssh-rootful-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: ssh-linux-integration
      - name: Verify TUN and cgroup v2 availability
        run: |
          if [ ! -c /dev/net/tun ]; then sudo modprobe tun; fi
          test -c /dev/net/tun
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          sudo mkdir -p /sys/fs/cgroup/yuhaiin-ssh-integration
      - name: Build SSH integration tests
        run: go test -c -o /tmp/yuhaiin-ssh-integration.test ./pkg/net/proxy/sshserver
      - name: Run isolated SSH TCP UDP DNS and shared-session tests
        run: |
          sudo YUH_SSH_SERVER_INTEGRATION=1 YUH_SSH_SERVER_MODE=rootful YUH_SSH_SERVER_CGROUP_ROOT=/sys/fs/cgroup/yuhaiin-ssh-integration \
            /tmp/yuhaiin-ssh-integration.test -test.v -test.timeout=300s \
            -test.run '^TestSSHServer(NetworkIntegration|SharesOnlyWithinConnection|FakeIPRouting|DisconnectKillsAllDescendants|SFTPIntegration)$'
      - name: Remove test cgroup parent
        if: always()
        run: |
          sudo find /sys/fs/cgroup/yuhaiin-ssh-integration -mindepth 1 -depth -type d -exec rmdir {} + || true
          sudo rmdir /sys/fs/cgroup/yuhaiin-ssh-integration || true
