name: DNS parity gofmt one shot
on:
  push:
    branches: [refactor/tailscale-lite-lightweight-only]
    paths: [.github/workflows/format-dns-one-time.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: dns-parity-final-format
      - name: Format DNS parity code
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w pkg/net/proxy/tailscale/tailscale.go pkg/net/proxy/tailscale/lite_dns.go pkg/net/proxy/tailscale/tailnet_integration_test.go
          git add pkg/net/proxy/tailscale/tailscale.go pkg/net/proxy/tailscale/lite_dns.go pkg/net/proxy/tailscale/tailnet_integration_test.go
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: gofmt DNS parity tests and integration'
          git push origin HEAD:refactor/tailscale-lite-lightweight-only
