# Temporary branch-scoped formatter. Remove after the generated formatting
# commit; no workflow runs on main.
name: format AmneziaWG draft
on:
  push:
    branches: [feat/five-vpn-protocols-20261011]
    paths:
      - 'pkg/net/proxy/amneziawg/**'
      - 'pkg/contract/node/types.go'
      - '.github/workflows/format-amneziawg-draft.yml'
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/five-vpn-protocols-20261011
          persist-credentials: true
      - name: Format touched Go files
        run: |
          gofmt -w pkg/contract/node/types.go pkg/net/proxy/amneziawg/*.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pkg/contract/node/types.go pkg/net/proxy/amneziawg
            git commit -m "style: gofmt AmneziaWG integration"
            git push origin HEAD:feat/five-vpn-protocols-20261011
          fi
