name: Lint and Fix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: actionlint
      - name: Check workflows and build scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck scripts/build/*.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: golangci-lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

  go-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: go-fix
      - name: gofmt check
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: go fix check
        run: |
          go fix ./...
          git diff --exit-code

  vpn-outbound-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: vpn-outbound-tests
      - name: Test VPN outbounds and node contract
        run: go test -race ./pkg/net/proxy/amneziawg/... ./pkg/net/proxy/enterprisevpn/... ./pkg/net/proxy/globalprotect ./pkg/net/proxy/softether/... ./pkg/contract/node ./pkg/register

  separate-vpn-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/five-vpn-protocols-20261011' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/five-vpn-protocols-20261011
          persist-credentials: true
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: vpn-package-migration
      - name: Split clients into four independent outbounds
        run: |
          if [[ ! -d pkg/net/proxy/enterprisevpn ]]; then exit 0; fi
          python3 scripts/separate_vpn_outbounds.py
          rm scripts/separate_vpn_outbounds.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pkg/net/proxy/ pkg/app/app.go scripts/ .github/workflows/lint.yml
          git commit -m "refactor(vpn): split IKEv2 AnyConnect SSTP Fortinet into independent proxy packages"
          git push origin HEAD:feat/five-vpn-protocols-20261011
