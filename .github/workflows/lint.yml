name: Lint and Fix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale checks after newer commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: golangci-lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  go-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: go-fix
      - name: gofmt check
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: go fix check
        run: |
          go fix ./...
          git diff --exit-code
      - name: Check workflows and build scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck scripts/build/*.sh

  vpn-outbound-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: vpn-outbound-tests
      - name: Test SSR protocols with the race detector
        run: go test -race -count=1 ./pkg/net/proxy/shadowsocksr/...
      - name: Test SSH outbound and node contract
        run: go test -race -count=1 -timeout=90s ./pkg/net/proxy/ssh/... ./pkg/contract/node ./pkg/register
      - name: Test MASQUE and CONNECT-IP independently with race detector
        # PMTU probing uses timers and packet acknowledgements. Keep this
        # network timing test out of the large parallel VPN package test run.
        run: go test -race -count=1 -p 1 -timeout=10m ./pkg/net/proxy/masque/...
      - name: Test VPN outbounds and node contract
        run: go test -race ./pkg/net/proxy/wireguard/... ./pkg/net/proxy/amneziawg/... ./pkg/net/proxy/nebula/... ./pkg/net/proxy/zerotier/... ./pkg/net/proxy/ikev2/... ./pkg/net/proxy/anyconnect/... ./pkg/net/proxy/sstp/... ./pkg/net/proxy/fortinet/... ./pkg/net/proxy/vpnkit/... ./pkg/net/proxy/globalprotect ./pkg/net/proxy/softether/... ./pkg/net/proxy/openvpn/... ./pkg/net/proxy/l2tp/... ./pkg/net/proxy/tailscale/... ./pkg/contract/node ./pkg/register

  tailscale-release-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: tailscale-release-dns
      - name: Test tsnet MagicDNS with production Tailscale build tags
        run: |
          go test ./cmd/buildtags
          tags="$(go run ./cmd/buildtags/...)"
          if [[ ",$tags," == *",ts_omit_dns,"* ]]; then
            echo "release build unexpectedly disables Tailscale MagicDNS" >&2
            exit 1
          fi
          go test -count=1 -tags="$tags" \
            -run '^(TestDNSPacket.*|TestTailscaleDNSManagerMissing|TestUnavailableTailscaleDialer)$' \
            ./pkg/net/proxy/tailscale

  network-conn-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: network-conn-contract
      - name: Reproduce canceled DERP dials and typed-nil connection failures
        run: |
          pattern='^(TestIsNilConn|TestIsNilPacketConn|TestHappyEyeballsDirectDialReturnsTrueNilOnFailure|TestHappyEyeballsV2GenericRejectsNilSuccess|TestHappyEyeballsParallelDoesNotReturnTypedNil|TestUnderlayNormalizesTypedNilTCP|TestUnderlayNormalizesTCPConnectionCleanup|TestUnderlayNormalizesTypedNilUDP)$'
          go test -race -count=1 -run "$pattern" \
            ./pkg/net/netapi ./pkg/net/dialer ./pkg/net/proxy/tailscale
          tags="$(go run ./cmd/buildtags/...)"
          go test -race -count=1 -tags="$tags" -run "$pattern" \
            ./pkg/net/netapi ./pkg/net/dialer ./pkg/net/proxy/tailscale

  http-gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: http-gateway-tests
      - name: Test Gateway, interception, CA, storage and inbound routing
        run: |
          go test -race -count=1 -timeout=300s \
            ./pkg/gateway ./pkg/cert ./pkg/net/proxy/http \
            ./pkg/net/proxy/tls ./pkg/inbound ./pkg/httpapi ./pkg/store ./pkg/store/backup/... \
            ./pkg/storage/sqlite ./pkg/route ./pkg/contract/connection ./pkg/resolver ./pkg/statistics \
            ./pkg/node ./pkg/app ./pkg/app/backup/... ./pkg/contract/inbound ./pkg/contract/node

  management-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: management-auth-tests
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Test management permissions and Web Crypto interoperability
        run: |
          go test -race -count=1 -timeout=300s \
            ./pkg/management/auth ./pkg/httpapi ./pkg/app ./pkg/app/backup/... ./cmd/yuhaiin/...
          go test -count=1 -tags=sqlite_mattn,fts5 -timeout=180s \
            ./pkg/storage/sqlite ./pkg/management/auth
