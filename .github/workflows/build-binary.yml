name: Build binary

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      arch:
        type: string
        required: true
      runner:
        type: string
        default: ubuntu-latest
      front_version:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      GOOS: ${{ inputs.os }}
      RELEASE_ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Update frontend
        env:
          FRONT_VERSION: ${{ inputs.front_version }}
        run: go get -v -u "github.com/yuhaiin/yuhaiin.github.io@${FRONT_VERSION}"

      - name: Install Linux cgo toolchain
        if: inputs.os == 'linux'
        run: |
          compiler=$(bash scripts/build/install-musl-toolchain.sh "$RELEASE_ARCH")
          echo "CC=$compiler" >> "$GITHUB_ENV"

      - name: Install Darwin compiler dependencies
        if: inputs.os == 'darwin'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 llvm-18 lld-18 g++ make patch xz-utils bzip2 cpio
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      - name: Restore Darwin toolchain
        if: inputs.os == 'darwin'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/osxcross
          key: osxcross-ubuntu24-${{ runner.arch }}-${{ hashFiles('scripts/build/install-darwin-toolchain.sh') }}

      - name: Set up Darwin cgo compiler
        if: inputs.os == 'darwin'
        run: |
          compiler=$(bash scripts/build/install-darwin-toolchain.sh "$RELEASE_ARCH")
          echo "CC=$compiler" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
          echo "${compiler%/*}" >> "$GITHUB_PATH"

      - name: Install Windows cgo toolchain
        if: inputs.os == 'windows'
        run: |
          compiler=$(bash scripts/build/install-windows-toolchain.sh "$RELEASE_ARCH")
          echo "CC=$compiler" >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          RELEASE_CHANNEL: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && 'main' || (contains(github.ref_name, 'beta') && 'beta' || 'stable') }}
          RELEASE_VERSION: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && format('main-{0}', github.sha) || '' }}
          RELEASE_TIMESTAMP: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && github.event.head_commit.timestamp || '' }}
        run: bash scripts/build/release.sh "$GOOS" "$RELEASE_ARCH"

      - name: Verify Windows binary
        if: inputs.os == 'windows'
        env:
          BINARY: ${{ steps.build.outputs.binary }}
        run: LLVM_READOBJ="${CC%/*}/llvm-readobj" bash scripts/build/check-windows-binary.sh "$BINARY" "$RELEASE_ARCH"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: yuhaiin_${{ inputs.os }}_${{ inputs.arch }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error
