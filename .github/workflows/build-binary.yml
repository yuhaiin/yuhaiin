name: Build binary

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      arch:
        type: string
        required: true
      runner:
        type: string
        default: ubuntu-latest
      front_version:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      GOOS: ${{ inputs.os }}
      RELEASE_ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
        with:
          cache-scope: release-${{ inputs.os }}-${{ inputs.arch }}
          dependency-key: ${{ inputs.front_version }}

      - name: Update frontend
        env:
          FRONT_VERSION: ${{ inputs.front_version }}
        run: go get -v -u "github.com/yuhaiin/yuhaiin.github.io@${FRONT_VERSION}"

      - name: Install Linux cgo toolchain
        if: inputs.os == 'linux' && !endsWith(inputs.arch, '-glibc')
        run: |
          compiler=$(bash scripts/build/install-musl-toolchain.sh "$RELEASE_ARCH")
          echo "CC=$compiler" >> "$GITHUB_ENV"

      - name: Install Windows binary inspection tool
        if: inputs.os == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm

      # The SDK and GNU linker come prebuilt from a release asset (see
      # freebsd-toolchain.yml); only clang is needed on the host.
      - name: Install FreeBSD cross compiler prerequisites
        if: inputs.os == 'freebsd' && inputs.arch == 'arm64'
        run: |
          if ! command -v clang >/dev/null || ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y clang zstd
          fi

      - name: Install FreeBSD cross toolchain
        if: inputs.os == 'freebsd' && inputs.arch == 'arm64'
        run: |
          compiler=$(bash scripts/build/install-freebsd-toolchain.sh "$RELEASE_ARCH")
          echo "CC=$compiler" >> "$GITHUB_ENV"

      - name: Cache OpenBSD SDK and LLVM
        if: inputs.os == 'openbsd'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/openbsd-cross
          key: openbsd-cross-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.arch == 'arm64' && 'arm64' || 'amd64' }}-${{ hashFiles('scripts/build/install-openbsd-toolchain.sh', 'scripts/build/install-windows-toolchain.sh') }}

      - name: Install OpenBSD cross toolchain
        if: inputs.os == 'openbsd'
        run: |
          compiler=$(bash scripts/build/install-openbsd-toolchain.sh "$RELEASE_ARCH")
          echo "CC=$compiler" >> "$GITHUB_ENV"

      - name: Cross-link BSD SQLite regression binaries
        if: inputs.os == 'openbsd' || (inputs.os == 'freebsd' && inputs.arch == 'arm64')
        env:
          GOARCH: ${{ inputs.arch == 'arm64' && 'arm64' || 'amd64' }}
          GOAMD64: v1
          CGO_ENABLED: '1'
        run: |
          # Compilation/link qualification only: Linux cannot execute BSD binaries.
          for package in sqlite fakeip migrate; do
            case "$package" in
              sqlite) source=./pkg/storage/sqlite ;;
              fakeip) source=./pkg/net/dns/fakeip ;;
              migrate) source=./pkg/migrate ;;
            esac
            binary="$RUNNER_TEMP/$package-$GOOS-$GOARCH.test"
            go test -c -tags=sqlite_cgo -o "$binary" "$source"
            bash "scripts/build/check-$GOOS-binary.sh" "$binary" "$GOARCH"
          done

      - name: Build
        id: build
        env:
          RELEASE_CHANNEL: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && 'main' || (contains(github.ref_name, 'beta') && 'beta' || 'stable') }}
          RELEASE_VERSION: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && format('main-{0}', github.sha) || '' }}
          RELEASE_TIMESTAMP: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && github.event.head_commit.timestamp || '' }}
        run: bash scripts/build/release.sh "$GOOS" "$RELEASE_ARCH"

      - name: Verify Windows binary
        if: inputs.os == 'windows'
        env:
          BINARY: ${{ steps.build.outputs.binary }}
        run: bash scripts/build/check-windows-binary.sh "$BINARY" "$RELEASE_ARCH"

      - name: Verify FreeBSD ARM64 binary
        if: inputs.os == 'freebsd' && inputs.arch == 'arm64'
        env:
          BINARY: ${{ steps.build.outputs.binary }}
        run: bash scripts/build/check-freebsd-binary.sh "$BINARY"

      - name: Verify OpenBSD binary
        if: inputs.os == 'openbsd'
        env:
          BINARY: ${{ steps.build.outputs.binary }}
        run: bash scripts/build/check-openbsd-binary.sh "$BINARY" "$RELEASE_ARCH"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: yuhaiin_${{ inputs.os }}_${{ inputs.arch }}
          path: |
            ${{ steps.build.outputs.binary }}
            ${{ steps.build.outputs.binary }}.update.json
          if-no-files-found: error
