name: Temporary Go format and module sync

on:
  push:
    branches: [refactor/tailscale-lite-lightweight-only]
    paths: [.github/workflows/format-lite-once.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: lite-integration-format
      - name: Fix, format and sync module graph
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w pkg/net/proxy/tailscale/*.go pkg/net/proxy/tun/tun.go pkg/net/proxy/tun/device/*.go pkg/net/netlink/tun.go cmd/android/yuhaiin.go cmd/android/yuhaiin_test.go cmd/android/keys.go cmd/buildtags/*.go
          go mod tidy
          go fix ./pkg/net/proxy/tailscale/... ./pkg/net/proxy/tun/... ./pkg/net/netlink/... ./cmd/buildtags/...
          gofmt -w pkg/net/proxy/tailscale/*.go pkg/net/proxy/tun/tun.go pkg/net/proxy/tun/device/*.go pkg/net/netlink/tun.go cmd/android/yuhaiin.go cmd/android/yuhaiin_test.go cmd/android/keys.go cmd/buildtags/*.go
          git add -u
          git add go.mod go.sum pkg/net/proxy/tailscale/*.go
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: gofmt and tidy lite migration'
          git push origin HEAD:refactor/tailscale-lite-lightweight-only
