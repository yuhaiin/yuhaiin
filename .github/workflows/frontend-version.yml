name: Resolve frontend version

on:
  workflow_call:
    outputs:
      front_version:
        value: ${{ jobs.resolve.outputs.front_version }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      front_version: ${{ steps.resolve.outputs.front_version }}
    steps:
      - id: resolve
        run: |
          # The v2 branch embeds the v2 Web UI build when it has been published;
          # every other ref keeps the stable main build.
          repo=https://github.com/yuhaiin/yuhaiin.github.io.git
          base="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          version=
          if [ "$base" = v2 ]; then
            version=$(git ls-remote "$repo" refs/heads/v2 | cut -f1)
          fi
          if [ -z "$version" ]; then
            version=$(git ls-remote --exit-code "$repo" refs/heads/main | cut -f1)
          fi
          test -n "$version"
          echo "front_version=$version" >> "$GITHUB_OUTPUT"
