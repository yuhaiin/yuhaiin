name: Temporary ZeroTier branch preparation

on:
  push:
    branches: [feat/zerotier-userspace-outbound]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: zerotier-preparation
      - name: Format ZeroTier files and resolve module checksums
        run: |
          gofmt -w pkg/net/proxy/zerotier/*.go pkg/contract/node/types.go pkg/register/point.go pkg/app/app.go
          go mod tidy
          git add go.mod go.sum pkg/net/proxy/zerotier pkg/contract/node/types.go pkg/register/point.go pkg/app/app.go
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore(zerotier): format Go code and tidy module checksums"
            git push
          fi
