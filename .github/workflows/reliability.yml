name: Enterprise reliability

on:
  pull_request:
    paths:
      - 'pkg/node/**'
      - 'pkg/app/**'
      - 'pkg/s3/**'
      - 'pkg/inbound/**'
      - 'pkg/route/**'
      - 'pkg/net/trafficcontrol/**'
      - 'pkg/net/netapi/**'
      - 'pkg/net/proxy/direct/**'
      - 'pkg/net/proxy/tailscale/**'
      - 'pkg/net/proxy/globalprotect/**'
      - 'pkg/net/proxy/openvpn/**'
      - 'pkg/net/proxy/l2tp/**'
      - 'pkg/net/proxy/softether/**'
      - 'pkg/contract/node/**'
      - 'pkg/contract/backup/**'
      - 'pkg/utils/lockfile/**'
      - 'pkg/net/latency/**'
      - 'pkg/store/**'
      - 'pkg/storage/sqlite/**'
      - 'pkg/httpapi/**'
      - 'pkg/management/auth/**'
      - 'cmd/android/**'
      - 'cmd/yuhaiin/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/reliability.yml'

concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: enterprise-reliability
      - name: Check source formatting and Go fixes
        run: |
          test -z "$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          go fix ./...
          git diff --exit-code
      - name: Deterministic scheduler and race coverage
        run: |
          go test -race -count=1 -timeout=180s \
            ./pkg/node ./pkg/net/latency ./pkg/store ./pkg/httpapi ./pkg/s3 \
            ./pkg/storage/sqlite ./pkg/management/auth ./cmd/android ./cmd/yuhaiin ./pkg/utils/lockfile \
            ./pkg/inbound ./pkg/route ./pkg/app ./pkg/net/trafficcontrol ./pkg/net/proxy/direct \
            ./pkg/net/proxy/openvpn/... ./pkg/net/proxy/l2tp/... ./pkg/net/proxy/softether/... \
            ./pkg/net/proxy/globalprotect ./pkg/net/proxy/tailscale
      - name: Selection and scheduler benchmarks
        run: |
          go test ./pkg/node -run '^$' -bench 'BenchmarkSelector|BenchmarkProbeScheduler|BenchmarkObservedPacketSend|BenchmarkNativeSelectionAvailability' \
            -benchmem -benchtime=300ms -count=2
      - name: Backup transfer and archive benchmarks
        run: |
          go test ./pkg/s3 -run '^$' -bench '^BenchmarkS3Upload$' -benchmem -benchtime=300ms -count=2
          go test ./pkg/store -run '^$' -bench '^BenchmarkRecoveryArchiveExternalRecipient$' -benchmem -benchtime=300ms -count=2
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m
