name: Enterprise reliability

on:
  pull_request:
    branches: [main]
    paths:
      - 'pkg/app/**'
      - 'pkg/s3/**'
      - 'pkg/management/**'
      - 'pkg/inbound/**'
      - 'pkg/httpapi/**'
      - 'pkg/cert/**'
      - 'pkg/gateway/**'
      - 'pkg/configuration/**'
      - 'pkg/credential/**'
      - 'pkg/security/**'
      - 'pkg/paths/**'
      - 'internal/version/**'
      - 'pkg/contract/**'
      - 'pkg/utils/lockfile/**'
      - 'pkg/store/**'
      - 'pkg/storage/**'
      - 'pkg/update/**'
      - 'cmd/yuhaiin/**'
      - 'scripts/build/release.sh'
      - '.github/workflows/build-binary.yml'
      - 'scripts/benchmarks/recovery/**'
      - 'scripts/bench/recovery-maintenance/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/actions/setup-go/**'
      - '.github/workflows/reliability.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recovery-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: [system, user]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: recovery-maintenance
      - name: Install isolated service-test runtime
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends podman
          fi
      - name: Actual capture, missing-archive S3 retrieval, restore and crash restart
        env:
          SERVICE_SCOPE: ${{ matrix.scope }}
        run: |
          python3 -m unittest discover -s scripts/bench/recovery-maintenance -p 'test_*.py'
          if [ "$SERVICE_SCOPE" = user ]; then
            python3 scripts/bench/recovery-maintenance/run.py --rootful --user-session --asset-mib 1
          else
            python3 scripts/bench/recovery-maintenance/run.py --rootful --asset-mib 256
          fi
