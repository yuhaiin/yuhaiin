name: Format SSTP credential test (temporary)
on:
  push:
    branches: [feat/rootless-sstp-server]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Format and remove temporary workflow
        run: |
          gofmt -w pkg/management/auth/proxy_credentials_test.go
          git rm .github/workflows/format-sstp-test-once.yml
          git add pkg/management/auth/proxy_credentials_test.go
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format SSTP credential rotation test"
          git push
