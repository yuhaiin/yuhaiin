name: Go

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  get_version:
    uses: ./.github/workflows/frontend-version.yml

  android:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: temurin

      - name: Build Android AAR
        env:
          FRONT_VERSION: ${{ needs.get_version.outputs.front_version }}
        run: |
          go get -v -u "github.com/yuhaiin/yuhaiin.github.io@${FRONT_VERSION}"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          make yuhaiin_android_aar

      - name: Upload Android AAR
        uses: actions/upload-artifact@v7
        with:
          name: yuhaiin.aar
          path: yuhaiin.aar
          if-no-files-found: error

  linux:
    needs: get_version
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, amd64v3, amd64v4, arm64, mipsle]
    uses: ./.github/workflows/build-binary.yml
    with:
      os: linux
      arch: ${{ matrix.arch }}
      front_version: ${{ needs.get_version.outputs.front_version }}

  darwin:
    needs: get_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: macos-15-intel}
          - {arch: amd64v3, runner: macos-15-intel}
          - {arch: amd64v4, runner: macos-15-intel}
          - {arch: arm64, runner: macos-15}
    uses: ./.github/workflows/build-binary.yml
    with:
      os: darwin
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      front_version: ${{ needs.get_version.outputs.front_version }}

  cross:
    needs: get_version
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd, windows]
        arch: [amd64, amd64v3, amd64v4, arm64]
        include:
          - {os: android, arch: arm64}
    uses: ./.github/workflows/build-binary.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      front_version: ${{ needs.get_version.outputs.front_version }}

  release:
    if: github.ref_type == 'tag' || (github.ref_type == 'branch' && github.ref_name == 'main')
    needs: [linux, darwin, cross, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: generate-release-notes
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$REF_TYPE" == "tag" ]]; then
            previous_tag=$(git describe --tags --match 'v*' --abbrev=0 HEAD^ 2>/dev/null || true)
          else
            # The rolling main release is intentionally excluded: its notes should
            # cover all changes since the latest stable or beta release.
            previous_tag=$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)
          fi

          if [[ -n "$previous_tag" ]]; then
            git log "$previous_tag..HEAD" --oneline > release_notes.txt
          else
            git log HEAD --oneline > release_notes.txt
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > checksums.txt

      - name: Update rolling release tag
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f main "$GITHUB_SHA"
          git push origin refs/tags/main --force

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.txt
          tag_name: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && 'main' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && format('main-{0}', github.sha) || github.ref_name }}
          draft: false
          overwrite_files: true
          make_latest: ${{ github.ref_type == 'tag' && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') }}
          prerelease: ${{ github.ref_type == 'branch' && github.ref_name == 'main' || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          # see: https://github.com/softprops/action-gh-release/issues/79#issuecomment-930339070
          files: |
            release_notes.txt
            checksums.txt
            artifacts/*/*
