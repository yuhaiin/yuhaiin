name: Go

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  get_version:
    outputs:
      front_version: ${{ steps.get-version.outputs.front_version }}
    runs-on: ubuntu-latest
    steps:
      - id: get-version
        run: |
          echo "front_version=$(git ls-remote https://github.com/yuhaiin/yuhaiin.github.io.git | grep refs/heads/main | cut -f1)" >> $GITHUB_OUTPUT

  android:
    needs: get_version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version: 'stable'
          # go-version-file: "go.mod"

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: build yuhaiin aar
        run: |
          go get -v -u github.com/yuhaiin/yuhaiin.github.io@${{ needs.get_version.outputs.front_version }}
          go env
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          make yuhaiin_android_aar

      - name: upload_android_aar
        uses: actions/upload-artifact@v7
        with:
          name: yuhaiin.aar
          path: yuhaiin.aar

  build:
    needs: get_version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          [
            [linux, "amd64"],
            [linux, "amd64v3"],
            [linux, "amd64v4"],
            [linux, "arm64"],
            [linux, "mipsle"],
            [android, "arm64"],
            [darwin, "amd64"],
            [darwin, "amd64v3"],
            [darwin, "amd64v4"],
            [darwin, "arm64"],
            [freebsd, "amd64"],
            [freebsd, "amd64v3"],
            [freebsd, "amd64v4"],
            [freebsd, "arm64"],
            [openbsd, "amd64"],
            [openbsd, "amd64v3"],
            [openbsd, "amd64v4"],
            [openbsd, "arm64"],
            [windows, "amd64"],
            [windows, "amd64v3"],
            [windows, "amd64v4"],
            [windows, "arm64"],
          ]
        cmd: [yuhaiin]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version: 'stable'
          # go-version-file: "go.mod"

      - name: Install musl-cross cgo toolchain
        if: matrix.env[0] == 'linux'
        run: |
          set -euo pipefail
          case "${{ matrix.env[1] }}" in
            amd64|amd64v3|amd64v4)
              toolchain_target="x86_64-unknown-linux-musl"
              toolchain_sha256="5f20e367608d6e547c04534d37d00ecedbaa0c2e82730df12957b3332fa36a2d"
              ;;
            arm64)
              toolchain_target="aarch64-unknown-linux-musl"
              toolchain_sha256="90282c463498dcdab9b96a464a0925d53f30c884b2d7b25e3998999416ae34b8"
              ;;
            mipsle)
              toolchain_target="mipsel-unknown-linux-muslsf"
              toolchain_sha256="f4677bd1e8792aa8ccab705295c4360f41dac0690cc8b3125df2c34e4fd66dfa"
              ;;
            *)
              echo "unsupported Linux release architecture: ${{ matrix.env[1] }}" >&2
              exit 1
              ;;
          esac

          toolchain_archive="${RUNNER_TEMP}/${toolchain_target}.tar.xz"
          toolchain_url="https://github.com/cross-tools/musl-cross/releases/download/20260515/${toolchain_target}.tar.xz"
          curl --fail --location --retry 3 --output "${toolchain_archive}" "${toolchain_url}"
          echo "${toolchain_sha256}  ${toolchain_archive}" | sha256sum --check
          tar --extract --xz --file "${toolchain_archive}" --directory "${RUNNER_TEMP}"
          toolchain_root="${RUNNER_TEMP}/${toolchain_target}"
          compiler="${toolchain_root}/bin/${toolchain_target}-gcc"
          test -x "${compiler}"
          echo "CC=${compiler}" >> "${GITHUB_ENV}"

      # - name: Set up Upx
      #   run: |
      #     sudo apt update
      #     sudo apt install -y upx

      # if [ ${{ matrix.os[0] }} != "darwin" ]; then
      # upx --lzma --best ${{ matrix.cmd }}_${{ matrix.os[0] }}_${{ matrix.arch }}${{ matrix.os[1] }}
      # fi
      - name: Build
        env:
          GOOS: ${{ matrix.env[0] }}
          RELEASE_ARCH: ${{ matrix.env[1] }}
          RELEASE_CHANNEL: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && 'main' || (contains(github.ref_name, 'beta') && 'beta' || 'stable') }}
          RELEASE_VERSION: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && format('main-{0}', github.sha) || '' }}
          RELEASE_TIMESTAMP: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && github.event.head_commit.timestamp || '' }}
          GOARCH: ${{ fromJSON('{"amd64v3":"amd64","amd64v4":"amd64"}')[matrix.env[1]] || matrix.env[1] }}
          GOAMD64: ${{ fromJSON('{"amd64v3":"v3","amd64v4":"v4"}')[matrix.env[1]] || '' }}
          GOMIPS: ${{ matrix.env[1] == 'mipsle' && 'softfloat' || '' }}
          CGO_ENABLED: ${{ matrix.env[0] == 'linux' && '1' || '0' }}
          STATIC_LINK: ${{ matrix.env[0] == 'linux' && '1' || '0' }}
          EXTRA_GO_TAGS: ${{ matrix.env[0] == 'linux' && 'sqlite_mattn' || '' }}
        run: |
          go get -v -u github.com/yuhaiin/yuhaiin.github.io@${{ needs.get_version.outputs.front_version }}
          make ${{ matrix.cmd }}
          mv yuhaiin${{ matrix.env[0] == 'windows' && '.exe' || '' }} yuhaiin-${{ matrix.env[0] }}-${{ matrix.env[1] }}${{ matrix.env[0] == 'windows' && '.exe' || '' }}

      - name: upload_${{ matrix.cmd }}_${{ matrix.env[0] }}_${{ matrix.env[1] }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cmd }}_${{ matrix.env[0] }}_${{ matrix.env[1] }}
          path: |
            yuhaiin-${{ matrix.env[0] }}-${{ matrix.env[1] }}${{ matrix.env[0] == 'windows' && '.exe' || '' }}

  release:
    if: github.ref_type == 'tag' || (github.ref_type == 'branch' && github.ref_name == 'main')
    needs: 
      - build
      - android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - id: generate-release-notes
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$REF_TYPE" == "tag" ]]; then
            previous_tag=$(git describe --tags --match 'v*' --abbrev=0 HEAD^ 2>/dev/null || true)
          else
            # The rolling main release is intentionally excluded: its notes should
            # cover all changes since the latest stable or beta release.
            previous_tag=$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)
          fi

          if [[ -n "$previous_tag" ]]; then
            git log "$previous_tag..HEAD" --oneline > release_notes.txt
          else
            git log HEAD --oneline > release_notes.txt
          fi

      - name: download_artifacts
        id: download-artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: generate_checksums
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > checksums.txt

      - name: update_main_release_tag
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f main "$GITHUB_SHA"
          git push origin refs/tags/main --force

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.txt
          tag_name: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && 'main' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_type == 'branch' && github.ref_name == 'main' && format('main-{0}', github.sha) || github.ref_name }}
          draft: false
          overwrite_files: true
          make_latest: ${{ github.ref_type == 'tag' && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') }}
          prerelease: ${{ github.ref_type == 'branch' && github.ref_name == 'main' || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          # see: https://github.com/softprops/action-gh-release/issues/79#issuecomment-930339070
          files: |
            release_notes.txt
            checksums.txt
            artifacts/*/*
