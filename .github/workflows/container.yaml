name: Container

on:
  push:
    branches: [main]
    tags: [v*]

jobs:
  get_version:
    outputs:
      front_version: ${{ steps.get-version.outputs.front_version }}
    runs-on: ubuntu-latest
    steps:
      - id: get-version
        run: |
          echo "front_version=$(git ls-remote https://github.com/yuhaiin/yuhaiin.github.io.git | grep refs/heads/main | cut -f1)" >> $GITHUB_OUTPUT

  package:
    needs: get_version
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version-file: "go.mod"

      - name: update dep
        run: |
          go get -v -u github.com/yuhaiin/yuhaiin.github.io@${{ needs.get_version.outputs.front_version }}

      - name: Install musl-cross cgo toolchains
        run: |
          set -euo pipefail
          declare -A toolchain_sha256=(
            [x86_64-unknown-linux-musl]=5f20e367608d6e547c04534d37d00ecedbaa0c2e82730df12957b3332fa36a2d
            [aarch64-unknown-linux-musl]=90282c463498dcdab9b96a464a0925d53f30c884b2d7b25e3998999416ae34b8
          )

          for toolchain_target in "${!toolchain_sha256[@]}"; do
            archive="${RUNNER_TEMP}/${toolchain_target}.tar.xz"
            url="https://github.com/cross-tools/musl-cross/releases/download/20260515/${toolchain_target}.tar.xz"
            curl --fail --location --retry 3 --output "${archive}" "${url}"
            echo "${toolchain_sha256[$toolchain_target]}  ${archive}" | sha256sum --check
            tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}"
            test -x "${RUNNER_TEMP}/${toolchain_target}/bin/${toolchain_target}-gcc"
          done

      - name: Build container binaries
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          mkdir -p .docker-binaries

          for arch in amd64 arm64; do
            if [[ "${arch}" == amd64 ]]; then
              toolchain_target=x86_64-unknown-linux-musl
            else
              toolchain_target=aarch64-unknown-linux-musl
            fi

            GOOS=linux GOARCH="${arch}" \
              CC="${RUNNER_TEMP}/${toolchain_target}/bin/${toolchain_target}-gcc" \
              CGO_ENABLED=1 STATIC_LINK=1 EXTRA_GO_TAGS=sqlite_mattn make yuhaiin
            mv yuhaiin ".docker-binaries/yuhaiin-linux-${arch}"
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: cmd/yuhaiin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
