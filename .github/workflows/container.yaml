name: Container

on:
  push:
    branches: [main]
    tags: [v*]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  get_version:
    uses: ./.github/workflows/frontend-version.yml

  package:
    needs: get_version
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-scope: container-linux-amd64-arm64
          dependency-key: ${{ needs.get_version.outputs.front_version }}

      - name: Update frontend
        env:
          FRONT_VERSION: ${{ needs.get_version.outputs.front_version }}
        run: go get -v -u "github.com/yuhaiin/yuhaiin.github.io@${FRONT_VERSION}"

      - name: Build container binaries
        env:
          GOTOOLCHAIN: auto
        run: |
          for arch in amd64 arm64; do
            compiler=$(bash scripts/build/install-musl-toolchain.sh "$arch")
            CC="$compiler" bash scripts/build/release.sh linux "$arch" .docker-binaries
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: cmd/yuhaiin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
