name: VPN protocol interoperability
on:
  pull_request:
    branches: [main]
    paths:
      - "pkg/net/proxy/wireguard/**"
      - "pkg/net/proxy/tun/lightweight/**"
      - "go.mod"
      - "go.sum"
      - "pkg/net/proxy/amneziawg/**"
      - "pkg/net/proxy/anyconnect/**"
      - "pkg/net/proxy/ikev2/**"
      - "pkg/net/proxy/vpnkit/**"
      - "pkg/net/proxy/internal/testutil/**"
      - "scripts/bench/amneziawg/**"
      - "scripts/bench/anyconnect/**"
      - "scripts/bench/ikev2/**"
      - ".github/actions/setup-go/**"
      - ".github/workflows/vpn-interop.yml"
  workflow_dispatch:

# Drop superseded automatic checks; preserve explicitly dispatched runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  protocol-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        protocol: [amneziawg, anyconnect, ikev2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: vpn-${{ matrix.protocol }}-interop
      - name: Run ${{ matrix.protocol }} against its container fixture
        run: python3 scripts/bench/${{ matrix.protocol }}/run.py --runtime docker
