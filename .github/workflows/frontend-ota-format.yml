name: Format frontend OTA Go (temporary)
on:
  push:
    branches: [feat/frontend-ota]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Format changed Go files
        run: |
          gofmt -w pkg/frontend/*.go pkg/app/frontend_recovery.go pkg/app/options.go \
            pkg/httpapi/api.go pkg/httpapi/endpoints.go pkg/httpapi/permissions.go pkg/httpapi/system_rpc.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pkg/frontend pkg/app/frontend_recovery.go pkg/app/options.go \
              pkg/httpapi/api.go pkg/httpapi/endpoints.go pkg/httpapi/permissions.go pkg/httpapi/system_rpc.go
            git commit -m "style: gofmt frontend OTA implementation"
            git push origin HEAD:feat/frontend-ota
          fi
