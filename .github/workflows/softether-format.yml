name: Format SoftEther feature branch
on:
  push:
    branches: [feat/softether-native-sslvpn]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/softether-native-sslvpn
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: softether-oneoff-format
      - name: Format and modernize new Go files
        run: |
          set -euo pipefail
          gofmt -w pkg/contract/node/types.go pkg/contract/node/softether_test.go pkg/net/proxy/softether/*.go pkg/net/proxy/softether/native/*.go pkg/net/proxy/wireguard/device.go
          go fix ./...
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pkg/contract/node/types.go pkg/contract/node/softether_test.go pkg/net/proxy/softether pkg/net/proxy/wireguard/device.go
          if ! git diff --cached --quiet; then
            git commit -m "style(softether): gofmt and go fix new native VPN code"
            git push origin HEAD:feat/softether-native-sslvpn
          fi
