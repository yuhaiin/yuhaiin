name: Temporary Passkey preparation
on:
  push:
    branches:
      - feature/management-passkeys
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format Passkey Go code and synchronize modules
        run: |
          gofmt -w pkg/management/auth/passkey.go pkg/management/auth/passkey_test.go pkg/storage/sqlite/management_auth.go pkg/management/auth/http.go pkg/management/auth/store.go pkg/storage/sqlite/management_auth_test.go
          go mod tidy
      - name: Commit deterministic formatting and module metadata
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum pkg/management/auth pkg/storage/sqlite
            git commit -m "Format WebAuthn implementation and tidy dependencies"
            git push origin HEAD:feature/management-passkeys
          fi
