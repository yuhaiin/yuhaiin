name: Native HY2 gofmt (temporary)
on:
  push:
    branches:
      - codex/native-hysteria2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'yuhaiin/yuhaiin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-hysteria2
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Format Hysteria 2 files
        shell: bash
        run: |
          find pkg/net/proxy/hysteria2 -type f -name '*.go' -print0 | xargs -0 gofmt -w
          git add pkg/net/proxy/hysteria2
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(hysteria2): format native implementation'
            git push origin HEAD:codex/native-hysteria2
          fi
