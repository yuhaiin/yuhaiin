name: Format SSTP implementation (temporary)
on:
  push:
    branches: [feat/rootless-sstp-server]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Format and remove temporary workflow
        run: |
          gofmt -w pkg/net/proxy/vpnkit/ppp/server.go pkg/net/proxy/vpnkit/ppp/server_test.go pkg/net/proxy/vpnkit/ppp/frame.go
          gofmt -w pkg/net/proxy/sstp/server.go pkg/net/proxy/sstp/server_test.go
          gofmt -w pkg/contract/inbound/types.go pkg/inbound/capabilities.go pkg/inbound/contract_listener.go
          git rm .github/workflows/format-sstp-once.yml
          git add pkg/net/proxy/vpnkit/ppp pkg/net/proxy/sstp pkg/contract/inbound/types.go pkg/inbound/capabilities.go pkg/inbound/contract_listener.go
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format SSTP server implementation"
          git push
