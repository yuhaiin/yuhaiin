name: macOS Network Protection (PF)

# Runs the kill switch against the real macOS packet filter on a disposable
# runner: rules, pf.conf registration, utun verdicts, tcpdump on the
# physical interface, core crash, service restart, recovery and the CLI
# under launchd. The tests restore /etc/pf.conf and remove what they create.

on:
  push:
    branches: [main, 'feat/network-protection*']
    paths:
      - 'pkg/sysnet/**'
      - 'cmd/yuhaiin/**'
      - 'scripts/integration/network-protection-macos.sh'
      - '.github/workflows/network-protection-macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pkg/sysnet/**'
      - 'cmd/yuhaiin/**'
      - 'scripts/integration/network-protection-macos.sh'
      - '.github/workflows/network-protection-macos.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pf:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: macos-network-protection
      - name: Unit tests on macOS
        run: go test ./pkg/sysnet/...
      - name: Real PF integration tests
        run: scripts/integration/network-protection-macos.sh --live
