name: Embedded Profiler

on:
  pull_request:
    paths:
      - 'pkg/app/profiler.go'
      - 'pkg/app/pprof_viewer.go'
      - 'pkg/app/pprof_viewer_home_test.go'
      - 'pkg/app/profiler_test.go'
      - 'pkg/app/options.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/profiler.yml'
  workflow_dispatch:

# Drop superseded automatic checks; preserve explicitly dispatched runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  profiler-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify profiler capture and official viewer
        run: go test -count=1 ./pkg/app -run '^TestProfiler'
