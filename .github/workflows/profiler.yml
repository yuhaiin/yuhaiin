name: Embedded Profiler

on:
  pull_request:
    paths:
      - 'pkg/app/profiler.go'
      - 'pkg/app/pprof_viewer.go'
      - 'pkg/app/pprof_viewer_home_test.go'
      - 'pkg/app/profiler_test.go'
      - 'pkg/app/options.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/profiler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiler-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: '-race'
          - os: macos-latest
            race: ''
          - os: windows-latest
            race: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify profiler capture and official viewer
        run: go test ${{ matrix.race }} -count=1 ./pkg/app -run '^TestProfiler'
