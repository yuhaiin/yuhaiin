name: OpenVPN official-server interop
on:
  pull_request:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/actions/setup-go/**"
      - "pkg/net/netapi/**"
      - "pkg/net/proxy/internal/testutil/**"
      - "pkg/net/proxy/wireguard/**"
      - "pkg/net/proxy/tun/lightweight/**"
      - "pkg/net/proxy/openvpn/**"
      - "pkg/contract/node/**"
      - "pkg/register/point.go"
      - "scripts/bench/openvpn/**"
      - ".github/workflows/openvpn-interop.yml"
  workflow_dispatch:

# Drop superseded automatic checks; preserve explicitly dispatched runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  official-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: openvpn-interop
      - name: Test stock OpenVPN with TCP, UDP, dual stack and rekey
        run: python3 scripts/bench/openvpn/run.py --runtime docker
