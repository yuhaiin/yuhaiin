name: SQLite regressions

on:
  push:
    branches: [main]
    paths:
      - 'pkg/storage/**'
      - 'internal/sqliteabi/**'
      - 'internal/sqlitetest/**'
      - 'pkg/store/**'
      - 'pkg/net/dns/fakeip/**'
      - 'pkg/statistics/**'
      - 'pkg/migrate/**'
      - 'pkg/update/**'
      - 'scripts/build/**'
      - 'pkg/node/**'
      - 'pkg/app/backup/**'
      - 'pkg/management/auth/**'
      - 'pkg/contract/**'
      - 'pkg/utils/**'
      - 'example/management-auth/**'
      - go.mod
      - go.sum
      - .github/workflows/test-sqlite.yml
      - .github/actions/setup-go/**
  pull_request:
    branches: [main]
    paths:
      - 'pkg/storage/**'
      - 'internal/sqliteabi/**'
      - 'internal/sqlitetest/**'
      - 'pkg/store/**'
      - 'pkg/net/dns/fakeip/**'
      - 'pkg/statistics/**'
      - 'pkg/migrate/**'
      - 'pkg/update/**'
      - 'scripts/build/**'
      - 'pkg/node/**'
      - 'pkg/app/backup/**'
      - 'pkg/management/auth/**'
      - 'pkg/contract/**'
      - 'pkg/utils/**'
      - 'example/management-auth/**'
      - go.mod
      - go.sum
      - .github/workflows/test-sqlite.yml
      - .github/actions/setup-go/**
  workflow_dispatch:
    inputs:
      windows_benchmarks:
        description: Compare PureGo embedded and static CGO SQLite on Windows
        type: boolean
        default: false

# Drop superseded automatic checks; preserve explicitly dispatched runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {backend: purego, cgo: '0', tags: '', flags: '', cc: gcc}
          - {backend: purego-race, cgo: '1', tags: sqlite_purego, flags: '-race', cc: gcc}
          - {backend: cgo-static, cgo: '1', tags: sqlite_cgo, flags: '', cc: musl-gcc}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      SQLITE_TAGS: ${{ matrix.tags }}
      SQLITE_FLAGS: ${{ matrix.flags }}
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: test-sqlite-${{ matrix.backend }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install musl for fully static tests
        if: matrix.backend == 'cgo-static'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test application persistence, identity, backups and recovery
        run: |
          flags=()
          if [[ "$SQLITE_FLAGS" == '-race' ]]; then flags+=(-race); fi
          if [[ "$CC" == musl-gcc ]]; then flags+=('-ldflags=-linkmode external -extldflags -static'); fi
          go test -count=1 -timeout=8m "${flags[@]}" -tags="${SQLITE_TAGS},stdlibjson,debug,fts5"             ./pkg/storage/sqlite ./pkg/store/... ./pkg/net/dns/fakeip ./pkg/statistics             ./pkg/migrate ./pkg/node ./pkg/app/backup/... ./pkg/management/auth             ./pkg/security/configchange ./pkg/update/maintenance
      - name: Verify static test binary has no loader or SQLite dependency
        if: matrix.backend == 'cgo-static'
        run: |
          go test -c -tags=sqlite_cgo -ldflags='-linkmode external -extldflags -static'             -o "$RUNNER_TEMP/sqlite-static.test" ./pkg/storage/sqlite
          if readelf -l "$RUNNER_TEMP/sqlite-static.test" | grep 'INTERP'; then exit 1; fi
          (cd pkg/storage/sqlite && "$RUNNER_TEMP/sqlite-static.test" -test.run=TestLegacyDriverDatabases)

  native-platforms:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: sqlite-native-${{ matrix.runner }}
      - name: Execute the embedded engine on the actual OS and CPU
        run: |
          # Recovery fixtures compare deployment paths; macOS exposes /var
          # through a symlink while production canonicalizes its data directory.
          if [[ "$RUNNER_OS" == macOS ]]; then
            TMPDIR=$(cd "$TMPDIR" && pwd -P)
            export TMPDIR
          fi
          packages=(./pkg/storage/sqlite ./pkg/store/... ./pkg/net/dns/fakeip
            ./pkg/statistics ./pkg/migrate ./pkg/security/configchange ./pkg/update/maintenance)
          if [[ "$RUNNER_OS" != Windows ]]; then
            packages+=(./pkg/node ./pkg/app/backup/...)
          else
            # Git Bash exposes short aliases for the user temp directory.
            TEMP=$(cygpath -w "$RUNNER_TEMP")
            TMP="$TEMP"
            export TEMP TMP
          fi
          go test -count=1 -timeout=8m "${packages[@]}"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The complete POSIX backup suite runs on Linux/macOS. Windows
            # uses its native ACL/durability and installed-service qualification.
            # Exercise durable node state without the unrelated TLS speed probe.
            go test -count=1 -timeout=5m -run '^(TestSelectorConnectionPathDoesNotQuerySQLite|TestUploadAndDownloadShareDurableDailyBudget|TestThroughputDirectionsPersistAndSmoothSeparately)$' ./pkg/node
            go test -count=1 -timeout=5m ./pkg/app/backup/internal/backupfs
            go test -count=1 -timeout=5m -run '^TestWindowsRecoveryArtifactsHavePrivateACLs$' ./pkg/store/backup/archive
            YUH_WINDOWS_RECOVERY_REQUIRE=1 go test -count=1 -timeout=5m -run '^(TestRecoveryTransaction.*|TestWindowsRecovery.*|TestEncryptedRecoveryRetainsPrivateSourceURL)$' ./pkg/app/backup/recovery
          fi

  linux-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: sqlite-linux-abi
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test actual glibc 2.17, older glibc, musl and scratch hosts
        run: bash scripts/build/test-linux-abi.sh

  mipsle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: sqlite-mipsle
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Build and run static fallback on MIPS little endian
        run: |
          compiler=$(bash scripts/build/install-musl-toolchain.sh mipsle)
          export GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=1 CC="$compiler"
          for package in sqlite fakeip; do
            path=./pkg/storage/sqlite
            if [[ "$package" == fakeip ]]; then path=./pkg/net/dns/fakeip; fi
            go test -c -ldflags='-linkmode external -extldflags -static' -o "$RUNNER_TEMP/$package.test" "$path"
            if readelf -l "$RUNNER_TEMP/$package.test" | grep 'INTERP'; then exit 1; fi
            (cd "$path" && qemu-mipsel "$RUNNER_TEMP/$package.test" -test.v -test.timeout=10m)
          done

  benchmark-compile:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: benchmark-sqlite-windows-${{ matrix.arch }}
      - name: Install Windows cgo toolchain
        run: |
          compiler=$(bash scripts/build/install-windows-toolchain.sh "$GOARCH")
          echo "CC=$compiler" >> "$GITHUB_ENV"
      - name: Compile both SQLite backends
        run: |
          mkdir -p windows-benchmarks
          CGO_ENABLED=1 go test -c -tags=sqlite_cgo,stdlibjson,debug,fts5 \
            -ldflags='-linkmode external -extldflags -static' \
            -o windows-benchmarks/statistics-cgo.test.exe ./pkg/statistics
          CGO_ENABLED=0 go test -c -tags=sqlite_purego,stdlibjson,debug,fts5 \
            -o windows-benchmarks/statistics-purego.test.exe ./pkg/statistics
      - name: Upload benchmark executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-benchmark-executables-${{ matrix.arch }}
          path: windows-benchmarks/*.exe
          if-no-files-found: error
          retention-days: 7

  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_benchmarks
    needs: benchmark-compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: windows-2025}
          - {arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download benchmark executables
        uses: actions/download-artifact@v8
        with:
          name: windows-benchmark-executables-${{ matrix.arch }}
          path: windows-benchmarks
      - name: Compare SQLite performance
        run: |
          foreach ($backend in @("purego", "cgo")) {
            & ".\windows-benchmarks\statistics-$backend.test.exe" '-test.run=^$' '-test.bench=BenchmarkPersistConnection|BenchmarkAllInfos|BenchmarkTelemetryFlush' '-test.benchmem' '-test.benchtime=500ms' '-test.count=3' '-test.timeout=5m' |
              Tee-Object -FilePath "windows-benchmarks\benchmark-$backend.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: windows-benchmarks-${{ matrix.arch }}
          path: windows-benchmarks/benchmark-*.txt
          if-no-files-found: error
          retention-days: 7
