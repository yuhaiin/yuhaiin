name: SQLite regressions

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/test-sqlite.yml
      - .github/actions/setup-go/**
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/test-sqlite.yml
      - .github/actions/setup-go/**
  workflow_dispatch:

# Drop superseded automatic checks; preserve explicitly dispatched runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {backend: mattn, cgo: '1'}
          - {backend: modernc, cgo: '0'}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      SQLITE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: test-sqlite-${{ matrix.backend }}
      - name: Check formatted defaults sources
        if: matrix.backend == 'modernc'
        run: |
          for f in pkg/migrate/defaults.go pkg/migrate/defaults_test.go; do
            printf 'FMT_BEGIN:%s\n' "$f"
            gofmt "$f" | base64 -w0
            printf '\nFMT_END:%s\n' "$f"
          done
      - name: Test storage, FakeIP, statistics, and state initialization
        run: |
          go test -timeout=5m -tags="sqlite_${SQLITE_BACKEND},stdlibjson,debug,fts5" \
            ./pkg/storage/sqlite ./pkg/net/dns/fakeip ./pkg/statistics ./pkg/migrate ./pkg/node
