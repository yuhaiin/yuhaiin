name: SQLite regressions

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/test-sqlite.yml
      - .github/actions/setup-go/**
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/test-sqlite.yml
      - .github/actions/setup-go/**
  workflow_dispatch:
    inputs:
      windows_benchmarks:
        description: Build and compare both Windows SQLite backends
        type: boolean
        default: false

# Drop superseded automatic checks; preserve explicitly dispatched runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {backend: mattn, cgo: '1'}
          - {backend: modernc, cgo: '0'}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      SQLITE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: test-sqlite-${{ matrix.backend }}
      - name: Test storage, FakeIP, statistics, and state initialization
        run: |
          go test -timeout=5m -tags="sqlite_${SQLITE_BACKEND},stdlibjson,debug,fts5" \
            ./pkg/storage/sqlite ./pkg/net/dns/fakeip ./pkg/statistics ./pkg/migrate ./pkg/node
      - name: Test S3 configuration backup snapshots
        run: |
          go test -timeout=5m -tags="sqlite_${SQLITE_BACKEND},stdlibjson,debug,fts5" \
            -run '^TestBackup' ./pkg/app/backup

  benchmark-compile:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: benchmark-sqlite-windows-${{ matrix.arch }}
      - name: Install Windows cgo toolchain
        run: |
          compiler=$(bash scripts/build/install-windows-toolchain.sh "$GOARCH")
          echo "CC=$compiler" >> "$GITHUB_ENV"
      - name: Compile both SQLite backends
        run: |
          mkdir -p windows-benchmarks
          CGO_ENABLED=1 go test -c -tags=sqlite_mattn,stdlibjson,debug,fts5 \
            -ldflags='-linkmode external -extldflags -static' \
            -o windows-benchmarks/statistics-mattn.test.exe ./pkg/statistics
          CGO_ENABLED=0 go test -c -tags=sqlite_modernc,stdlibjson,debug,fts5 \
            -o windows-benchmarks/statistics-modernc.test.exe ./pkg/statistics
      - name: Upload benchmark executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-benchmark-executables-${{ matrix.arch }}
          path: windows-benchmarks/*.exe
          if-no-files-found: error
          retention-days: 7

  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_benchmarks
    needs: benchmark-compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: windows-2025}
          - {arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download benchmark executables
        uses: actions/download-artifact@v8
        with:
          name: windows-benchmark-executables-${{ matrix.arch }}
          path: windows-benchmarks
      - name: Compare SQLite performance
        run: |
          foreach ($backend in @("modernc", "mattn")) {
            & ".\windows-benchmarks\statistics-$backend.test.exe" '-test.run=^$' '-test.bench=BenchmarkPersistConnection|BenchmarkAllInfos|BenchmarkTelemetryFlush' '-test.benchmem' '-test.benchtime=500ms' '-test.count=3' '-test.timeout=5m' |
              Tee-Object -FilePath "windows-benchmarks\benchmark-$backend.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: windows-benchmarks-${{ matrix.arch }}
          path: windows-benchmarks/benchmark-*.txt
          if-no-files-found: error
          retention-days: 7
