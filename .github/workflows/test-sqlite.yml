name: SQLite regressions

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/test-sqlite.yml
      - .github/actions/setup-go/**
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/test-sqlite.yml
      - .github/actions/setup-go/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {backend: mattn, cgo: '1'}
          - {backend: modernc, cgo: '0'}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      SQLITE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: test-sqlite-${{ matrix.backend }}
      - name: Test storage, FakeIP, statistics, and legacy settings
        run: |
          go test -timeout=5m -tags="sqlite_${SQLITE_BACKEND},stdlibjson,debug,fts5" \
            ./pkg/storage/sqlite ./pkg/net/dns/fakeip ./pkg/statistics ./pkg/legacy/chore
